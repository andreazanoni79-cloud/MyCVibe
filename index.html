<html>

<head>
	<!-- CSS -->
	<link rel="stylesheet" href="index.css">
	<!-- Font Awesome CDN -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body> 
	<header>
		<h1 class="title">My CVibe</h1><img class="title-pic" src="public/images/currriculumIco.png" alt="Profile Picture">
	</header>
	<main>
		<div class="tweet-input-area"> 
			<img src="\images\AndreaZ.png" class="profile-pic">
			<textarea placeholder="Quieres contactar?" id="tweet-input"></textarea>
		</div>
		<button id="contact-btn" type="button" aria-expanded="false">
  Contactar
</button>

<div id="contact-form" class="contact-overlay hidden">
  <section class="contact-card">
	<button id="close-contact" class="close-contact" type="button" aria-label="Cerrar formulario">
 	 &times;
	</button>
    <h2>Envíame un mensaje</h2>

    <form name="contacto" method="POST" data-netlify="true">
      <label>
        Tu nombre
        <input type="text" name="nombre" required>
      </label>

      <label>
        Tu correo electrónico
        <input type="email" name="email" required>
      </label>

      <label>
        Mensaje
        <textarea name="mensaje" required></textarea>
      </label>

      <button type="submit">Enviar mensaje</button>
    </form>
  </section>
</div>

<div id="feed"></div>
			<!-- Tweets here!! -->
		
	</main>
	<script src="index.js" type="module"></script>
</body>

</html>
